<!DOCTYPE html>
<html>
  <head>
    <title>pgp --generateKeys</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../common.css">
    <script type="module" src="main.js"></script>
  </head>
  <body>
    <header>
      <h1>pgp --generateKeys</h1>
    </header>
    <main>
      <textarea
        id="input-username"
        autocapitalize="off"
        spellcheck="false"
        autocomplete="off"
        rows="1"
        placeholder="username"
      ></textarea>
      <textarea
        id="input-email"
        autocapitalize="off"
        spellcheck="false"
        autocomplete="off"
        rows="1"
        placeholder="email"
      ></textarea>
      <textarea
        id="input-password"
        autocapitalize="off"
        spellcheck="false"
        autocomplete="off"
        rows="1"
        placeholder="password"
      ></textarea>
      <textarea
        id="output-pubkey"
        readonly="readonly"
        spellcheck="false"
        autocomplete="off"
        id="output-pubkey"
        rows="5"
        placeholder="pubkey"
      ></textarea>
      <textarea
        id="output-privkey"
        readonly="readonly"
        spellcheck="false"
        autocomplete="off"
        id="output-privkey"
        rows="5"
        placeholder="privkey"
      ></textarea>
    </main>
  </body>
</html>
